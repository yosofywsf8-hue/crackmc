name: Build CrackMC Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload CrackMC JAR
        uses: actions/upload-artifact@v4
        with:
          name: CrackMC-mod
          path: build/libs/*-1.0.0.jar
